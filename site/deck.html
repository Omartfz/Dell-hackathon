<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deck · SafeContext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    .deck { height: 100%; position: relative; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8vh 6vw 14vh; }
    .scene { width: min(1100px, 100%); text-align: center; }
    .scene.left { text-align: left; }
    .label {
      position: absolute; bottom: 7vh; left: 6vw;
      font-size: 2.6vmin; font-weight: 500; letter-spacing: -0.02em;
      opacity: 0; animation: fade 0.6s var(--ease) 0.2s forwards;
    }
    .pos {
      position: absolute; bottom: 7vh; right: 6vw;
      font-size: 1.6vmin; color: var(--g500); font-variant-numeric: tabular-nums;
    }
    .h {
      font-size: 7.2vmin; font-weight: 600; letter-spacing: -0.022em; line-height: 1.08;
    }
    .h2 {
      font-size: 6.6vmin; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12;
    }
    .num {
      font-size: 13.5vmin; font-weight: 700; letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums lining-nums;
    }
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 2.4vmin; margin-top: 4vmin; text-align: left; }
    .tile {
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 3.2vmin;
      min-height: 28vmin;
      display: flex;
      flex-direction: column;
    }
    .track {
      margin-top: auto;
      height: 10px;
      background: var(--g200);
      border-radius: 2px;
      overflow: hidden;
    }
    .fill {
      height: 100%;
      width: 0;
      background: var(--ink);
      transition: width 1.05s var(--ease);
    }
    .enter {
      opacity: 0; transform: translateY(10px);
      animation: rise 0.9s var(--ease) forwards;
    }
    .enter-line {
      opacity: 0; transform: translateY(0.35em);
      animation: rise 0.7s var(--ease) forwards;
    }
    .glass {
      display: inline-block;
      border-radius: var(--radius-card);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 6vmin 8vmin;
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(26px) saturate(120%);
      -webkit-backdrop-filter: blur(26px) saturate(120%);
      box-shadow: var(--shadow-raised);
    }
    .fade-scene { animation: sceneIn 0.35s ease-out; }
    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes fade { to { opacity: 1; } }
    @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
    .arch {
      font-size: 2.2vmin; line-height: 1.65; text-align: left;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }
    @media (max-width: 700px) { .pair { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <div class="layer deck-grid"></div>
    <div class="layer deck-halo" style="width:70%;height:70%;left:-10%;top:-20%"></div>
    <div class="layer deck-halo deck-halo-b" style="width:60%;height:60%;right:-10%;bottom:-20%;left:auto"></div>
    <div class="layer deck-grain"></div>
    <div class="stage" id="stage"></div>
    <div class="label" id="label"></div>
    <div class="pos tnum" id="pos"></div>
  </div>
  <script>
    const EASE = "cubic-bezier(0.19, 1, 0.22, 1)";
    const LAST = 15;
    const GROUP = { 1:"s1",2:"s2",3:"s3",4:"s4",5:"s4",6:"s6",7:"s7",8:"s8",9:"s8",10:"s10",11:"s11",12:"s12",13:"s13",14:"s14",15:"s15" };
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let n = 1;
    let idleTimer;

    const LABELS = {
      1: "The report is due tomorrow.",
      2: "Everyone wants Claude.",
      3: "The tools get blocked.",
      4: "Same report. Sensitive-free.",
      5: "Same report. Sensitive-free.",
      6: "It is the same analysis.",
      7: "KEEP · TRANSFORM · REMOVE",
      8: "Magnitude is enough.",
      9: "Magnitude is enough.",
      10: "Change Mongo. The payload changes.",
      11: "Qwen sees the file. Claude sees the envelope.",
      12: "The system",
      13: "Three jobs. One record.",
      14: "Copy. Then use Claude.",
      15: "SafeContext"
    };

    function el(html) {
      const d = document.createElement("div");
      d.className = "scene fade-scene";
      d.innerHTML = html;
      return d;
    }

    function render() {
      const stage = document.getElementById("stage");
      const prevGroup = stage.dataset.group;
      const group = GROUP[n];
      document.getElementById("label").textContent = LABELS[n];
      document.getElementById("pos").textContent = n + " / " + LAST;
      history.replaceState(null, "", "#" + n);

      if (prevGroup === group && (n === 4 || n === 5 || n === 8 || n === 9)) {
        build(n);
        return;
      }
      stage.dataset.group = group;
      stage.innerHTML = "";
      const scene = sceneFor(n);
      stage.appendChild(scene);
      if (n === 5 || n === 9) build(n);
      if (n === 4) build(4);
      if (n === 8) build(8);
    }

    function sceneFor(n) {
      if (n === 1) {
        const s = el(`<div class="glass enter"><div class="h">The report is due tomorrow.</div></div>`);
        s.classList.add("scene");
        return s;
      }
      if (n === 2) {
        const s = el(`<div class="h2 enter-line">Everyone wants Claude.</div>
          <div class="h2 enter-line" id="l2" style="margin-top:0.4em">Security says no.</div>`);
        s.querySelector("#l2").style.animationDelay = reduced ? "0s" : "2.4s";
        return s;
      }
      if (n === 3) {
        const s = el(`<div class="h2 enter-line">They block the tool.</div>
          <div class="h2 enter-line" id="l3" style="margin-top:0.4em">They do not build a better one.</div>`);
        s.querySelector("#l3").style.animationDelay = reduced ? "0s" : "2.4s";
        return s;
      }
      if (n === 4 || n === 5) {
        return el(`<div class="pair">
          <div class="tile enter" style="animation-delay:0.1s">
            <p class="caps">The whole file</p>
            <div class="num" id="nL" style="font-size:8vmin"> </div>
            <p style="color:var(--g500);font-size:1.8vmin;margin-top:1vmin" id="cL">What people paste today</p>
            <div class="track"><div class="fill" id="fL"></div></div>
          </div>
          <div class="tile enter" style="animation-delay:0.22s">
            <p class="caps">SafeContext</p>
            <div class="num" id="nR" style="font-size:8vmin"> </div>
            <p style="color:var(--g500);font-size:1.8vmin;margin-top:1vmin" id="cR">What the report needs</p>
            <div class="track"><div class="fill" id="fR"></div></div>
          </div>
        </div>`);
      }
      if (n === 6) {
        return el(`<div class="h enter">It is the same analysis.</div>`);
      }
      if (n === 7) {
        return el(`<div class="h2 enter-line">KEEP</div>
          <div class="h2 enter-line" style="margin-top:0.2em;animation-delay:0.55s">TRANSFORM</div>
          <div class="h2 enter-line" style="margin-top:0.2em;animation-delay:1.1s">REMOVE</div>`);
      }
      if (n === 8 || n === 9) {
        return el(`<div class="num enter" id="arr">$847,291</div>
          <p class="caps" id="arrsub" style="margin-top:2vmin;opacity:0">exact figure in the file</p>`);
      }
      if (n === 10) {
        return el(`<div class="h2 enter-line">analyst</div>
          <div class="h2 enter-line" style="margin-top:0.3em;color:var(--g500);animation-delay:0.7s">then manager</div>`);
      }
      if (n === 11) {
        return el(`<div class="pair">
          <div class="tile enter"><p class="caps">GB10</p><div style="font-size:3.4vmin;font-weight:600;letter-spacing:-0.02em;margin-top:1vmin">Qwen sees the file</div></div>
          <div class="tile enter" style="animation-delay:0.18s"><p class="caps">Off box</p><div style="font-size:3.4vmin;font-weight:600;letter-spacing:-0.02em;margin-top:1vmin">Claude sees the envelope</div></div>
        </div>`);
      }
      if (n === 12) {
        return el(`<pre class="arch enter">task
  → OpenClaw + local Qwen
  → MongoDB   whoami · bundle · policy
  → spec { keep, transform, drop }
  → minimize()
  → copy-ready JSON
  → you → Claude</pre>`);
      }
      if (n === 13) {
        return el(`<div class="h2 enter-line">The report.</div>
          <div class="h2 enter-line" style="margin-top:0.2em;animation-delay:0.55s">The email.</div>
          <div class="h2 enter-line" style="margin-top:0.2em;animation-delay:1.1s">Flip the role.</div>`);
      }
      if (n === 14) {
        return el(`<div class="h enter">Copy. Then use Claude.</div>`);
      }
      return el(`<div class="h enter">SafeContext</div>
        <p class="caps enter" style="margin-top:2.4vmin;animation-delay:0.45s;letter-spacing:0.14em">Prompt the model. Keep the leak on the box.</p>`);
    }

    function count(el, to, ms) {
      if (!el) return;
      if (reduced) { el.textContent = String(to); return; }
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - t0) / ms);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = String(Math.round(e * to));
        if (p < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    function build(slide) {
      if (slide === 4) {
        const nL = document.getElementById("nL");
        const nR = document.getElementById("nR");
        const fL = document.getElementById("fL");
        const fR = document.getElementById("fR");
        const cL = document.getElementById("cL");
        const cR = document.getElementById("cR");
        if (nL) nL.textContent = "";
        if (nR) nR.textContent = "";
        if (fL) fL.style.width = "0";
        if (fR) fR.style.width = "0";
        if (cL) cL.textContent = "What people paste today";
        if (cR) cR.textContent = "What the report needs";
      }
      if (slide === 5) {
        const nL = document.getElementById("nL");
        const nR = document.getElementById("nR");
        const fL = document.getElementById("fL");
        const fR = document.getElementById("fR");
        const cL = document.getElementById("cL");
        const cR = document.getElementById("cR");
        if (cL) cL.textContent = "of 17 information units";
        if (cR) cR.textContent = "of 17 information units";
        count(nL, 17, 900);
        count(nR, 6, 900);
        requestAnimationFrame(() => {
          if (fL) fL.style.width = "100%";
          if (fR) fR.style.width = "35%";
        });
      }
      if (slide === 8) {
        const arr = document.getElementById("arr");
        const sub = document.getElementById("arrsub");
        if (arr) { arr.textContent = "$847,291"; arr.style.opacity = "1"; }
        if (sub) { sub.textContent = "exact figure in the file"; sub.style.opacity = "1"; }
      }
      if (slide === 9) {
        const arr = document.getElementById("arr");
        const sub = document.getElementById("arrsub");
        if (arr) {
          arr.style.transition = "opacity 0.35s ease-out";
          arr.style.opacity = "0";
          setTimeout(() => {
            arr.textContent = "$500k-$1M";
            arr.style.opacity = "1";
            arr.style.animation = "rise 0.9s " + EASE;
          }, reduced ? 0 : 280);
        }
        if (sub) {
          sub.textContent = "the band the report actually needs";
          sub.style.transition = "opacity 0.6s " + EASE;
          sub.style.opacity = "1";
        }
      }
    }

    function go(d) {
      n = Math.max(1, Math.min(LAST, n + d));
      render();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    });
    document.getElementById("stage").addEventListener("click", () => go(1));

    function wake() {
      document.getElementById("deck").classList.remove("cursor-hidden");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.getElementById("deck").classList.add("cursor-hidden"), 2000);
    }
    window.addEventListener("mousemove", wake);
    wake();

    const h = Number(location.hash.replace("#", ""));
    n = h >= 1 && h <= LAST ? h : 1;
    render();
  </script>
</body>
</html>
