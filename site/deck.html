<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deck · SafeContext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    .deck { height: 100%; position: relative; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8vh 6vw 14vh; }
    .scene { width: min(1100px, 100%); text-align: center; }
    .label {
      position: absolute; bottom: 7vh; left: 6vw;
      font-size: 2.6vmin; font-weight: 500; letter-spacing: -0.02em;
      opacity: 0; animation: fade 0.6s var(--ease) 0.2s forwards;
    }
    .pos {
      position: absolute; bottom: 7vh; right: 6vw;
      font-size: 1.6vmin; color: var(--g500); font-variant-numeric: tabular-nums;
    }
    .h {
      font-size: 7.2vmin; font-weight: 600; letter-spacing: -0.022em; line-height: 1.08;
    }
    .h2 {
      font-size: 6.6vmin; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12;
    }
    .sub {
      margin-top: 2.4vmin;
      font-size: 2.8vmin; font-weight: 500; letter-spacing: -0.02em; color: var(--g600);
    }
    .enter {
      opacity: 0; transform: translateY(10px);
      animation: rise 0.9s var(--ease) var(--d, 0s) forwards;
    }
    .enter-line {
      opacity: 0; transform: translateY(0.35em);
      animation: rise 0.7s var(--ease) var(--d, 0s) forwards;
    }
    .glass {
      display: inline-block;
      border-radius: var(--radius-card);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 6vmin 8vmin;
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(26px) saturate(120%);
      -webkit-backdrop-filter: blur(26px) saturate(120%);
      box-shadow: var(--shadow-raised);
    }
    .fade-scene { animation: sceneIn 0.35s ease-out; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes grow { to { width: 100%; } }

    .names { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.6vmin 3.2vmin; margin-top: 4.4vmin; }
    .names span { font-size: 4.4vmin; font-weight: 600; letter-spacing: -0.03em; }
    .list { display: flex; flex-direction: column; align-items: center; gap: 1.1vmin; }
    .list > div { font-size: 4.4vmin; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; }

    .caption { margin-top: 3.4vmin; font-size: 2.4vmin; font-weight: 500; color: var(--g600); }

    /* flow schema */
    .flow {
      display: grid;
      grid-template-columns: 1fr 12vmin 1.15fr 12vmin 1fr;
      align-items: center;
      gap: 0;
      text-align: left;
    }
    .node {
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: 3vmin 2.6vmin;
      min-height: 17vmin;
      display: flex; flex-direction: column; justify-content: center; gap: 0.9vmin;
    }
    .node b { font-size: 3vmin; font-weight: 600; letter-spacing: -0.02em; }
    .node span { font-size: 1.85vmin; color: var(--g500); line-height: 1.35; }
    .node.core { box-shadow: var(--shadow-raised); border: 1px solid var(--g200); }
    .conn { position: relative; height: 2px; }
    .conn::before {
      content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 0;
      background: var(--g400);
      animation: grow 0.75s var(--ease) var(--d, 0s) forwards;
    }
    .conn::after {
      content: ""; position: absolute; right: 0; top: -4.5px; opacity: 0;
      border-left: 9px solid var(--g400);
      border-top: 5.5px solid transparent;
      border-bottom: 5.5px solid transparent;
      animation: fade 0.4s var(--ease) calc(var(--d, 0s) + 0.6s) forwards;
    }
    .conn em {
      position: absolute; left: 50%; top: -3.4vmin; transform: translateX(-50%);
      font-style: normal; font-size: 1.6vmin; font-weight: 600; color: var(--g500);
      white-space: nowrap; opacity: 0;
      animation: fade 0.5s var(--ease) calc(var(--d, 0s) + 0.5s) forwards;
    }

    /* redacted document */
    .doc {
      background: var(--surface);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-raised);
      padding: 4vmin 4.4vmin;
      text-align: left;
      max-width: 82vmin;
      margin: 0 auto;
    }
    .doc .caps { margin-bottom: 2.6vmin; }
    .row {
      display: grid;
      grid-template-columns: 16vmin 1fr auto;
      align-items: baseline;
      gap: 2vmin;
      padding: 1.5vmin 0;
      border-top: 1px solid var(--g150);
      font-size: 2.4vmin;
    }
    .row:first-of-type { border-top: 0; }
    .row .k { font-size: 1.7vmin; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--g500); }
    .strike { position: relative; color: var(--g500); font-weight: 500; justify-self: start; }
    .strike::after {
      content: ""; position: absolute; left: -0.15em; top: 52%; height: 2px; width: 0;
      background: var(--ink);
      animation: grow 0.5s var(--ease) var(--d, 0s) forwards;
    }
    .to {
      font-weight: 600; letter-spacing: -0.01em; opacity: 0;
      animation: fade 0.55s var(--ease) calc(var(--d, 0s) + 0.35s) forwards;
    }

    /* spreadsheets grid */
    .sheets {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 1.4vmin;
      max-width: 82vmin;
      margin: 0 auto 3.4vmin;
    }
    .sheet {
      aspect-ratio: 3 / 4;
      background: var(--surface);
      border-radius: 5px;
      box-shadow: var(--shadow-card);
      padding: 0.7vmin;
      display: flex; flex-direction: column; gap: 0.4vmin;
      opacity: 0; transform: translateY(10px);
      animation: rise 0.7s var(--ease) var(--d, 0s) forwards;
    }
    .sheet i { display: block; height: 0.55vmin; border-radius: 1px; background: var(--g200); }
    .sheet i:first-child { background: var(--ink); width: 60%; }

    /* system map — the diagram slide needs a wider column than the text slides */
    .scene.wide { width: min(1460px, 100%); }
    .sysmap { width: 100%; height: auto; display: block; margin: 0 auto; }
    .sysmap .box { fill: rgba(255,255,255,0.62); stroke: var(--g300); stroke-width: 1.25; }
    .sysmap .box-key { fill: var(--surface); stroke: var(--g500); stroke-width: 1.7; }
    .sysmap .box-out { fill: rgba(255,255,255,0.3); stroke: var(--g400); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .sysmap .store { fill: rgba(255,255,255,0.62); stroke: var(--g300); stroke-width: 1.25; }
    .sysmap .fence { fill: none; stroke: var(--g400); stroke-width: 1.25; stroke-dasharray: 7 6; }
    .sysmap .edge { fill: none; stroke: var(--g400); stroke-width: 1.4; }
    .sysmap .edge-key { fill: none; stroke: var(--ink); stroke-width: 2; }
    .sysmap .mk-g { fill: var(--g400); }
    .sysmap .mk-i { fill: var(--ink); }
    .sysmap .t { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; fill: var(--ink); }
    .sysmap .s { font-size: 11.5px; fill: var(--g600); }
    .sysmap .e {
      font-size: 11px; fill: var(--g500);
      paint-order: stroke fill; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round;
    }
    .sysmap .z { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; fill: var(--g500); }

    @media (max-width: 820px) {
      .flow { grid-template-columns: 1fr; gap: 2vmin; }
      .conn { display: none; }
      .sheets { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <div class="layer deck-grid"></div>
    <div class="layer deck-halo" style="width:70%;height:70%;left:-10%;top:-20%"></div>
    <div class="layer deck-halo deck-halo-b" style="width:60%;height:60%;right:-10%;bottom:-20%;left:auto"></div>
    <div class="layer deck-grain"></div>
    <div class="stage" id="stage"></div>
    <div class="label" id="label"></div>
    <div class="pos tnum" id="pos"></div>
  </div>
  <script>
    const LAST = 14;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let n = 1;
    let idleTimer;

    const LABELS = {
      1: "Ask for more. Send less. More safety.",
      2: "Everyone wants the new tools.",
      3: "Institutions run on privacy.",
      4: "So they never start.",
      5: "A layer between you and the model.",
      6: "Names change. Numbers change.",
      7: "This is what we do to the document.",
      8: "This is what leaves the box.",
      9: "Bob has 20 spreadsheets.",
      10: "He wants Claude.",
      11: "The files stay on the GB10.",
      12: "Mongo holds the record.",
      13: "The system",
      14: "SafeContext"
    };

    const TOOLS = ["Claude Code", "Cowork", "Codex", "Copilot", "ChatGPT", "Gemini"];
    const CONSTRAINTS = ["Client PII", "Patient records", "Account numbers", "Exact balances", "Internal memos"];
    const REDACTED = [
      ["Client", "Jane Doe", "CLIENT_01"],
      ["Account", "FR76 3000 6001 4471", "ACCT_7"],
      ["Balance", "$847,291", "$500k-$1M"],
      ["Transfer", "$2,400,000", "seven figures"],
      ["Note", "CFO evaluating Competitor X", "removed"]
    ];

    // delay helper: 0 when the user asked for reduced motion
    function d(s) { return reduced ? "0s" : s + "s"; }

    function el(html, extra) {
      const node = document.createElement("div");
      node.className = "scene fade-scene" + (extra ? " " + extra : "");
      node.innerHTML = html;
      return node;
    }

    function render() {
      const stage = document.getElementById("stage");
      document.getElementById("label").textContent = LABELS[n];
      document.getElementById("pos").textContent = n + " / " + LAST;
      history.replaceState(null, "", "#" + n);
      stage.innerHTML = "";
      stage.appendChild(sceneFor(n));
    }

    function two(a, b) {
      return el(`<div class="h2 enter-line">${a}</div>
        <div class="h2 enter-line" style="margin-top:0.4em;--d:${d(2.4)}">${b}</div>`);
    }

    function sceneFor(n) {
      if (n === 1) {
        return el(`<div class="glass enter">
          <div class="caps" style="margin-bottom:2.2vmin;letter-spacing:0.22em">SafeContext</div>
          <div class="h">Ask for more.<br />Send less.<br />More safety.</div>
        </div>`);
      }
      if (n === 2) {
        const chips = TOOLS.map((name, i) =>
          `<span class="enter" style="--d:${d(0.18 + i * 0.12)}">${name}</span>`).join("");
        return el(`<div class="h2 enter-line">Everyone wants the new tools.</div>
          <div class="names">${chips}</div>`);
      }
      if (n === 3) {
        const rows = CONSTRAINTS.map((line, i) =>
          `<div class="enter-line" style="--d:${d(0.15 + i * 0.22)}">${line}</div>`).join("");
        return el(`<div class="list">${rows}</div>
          <p class="caption enter" style="--d:${d(1.5)}">Banks. Hospitals. Insurers.</p>`);
      }
      if (n === 4) {
        return two("So they never start.", "The tool is blocked on day one.");
      }
      if (n === 5) {
        return el(`<div class="flow">
          <div class="node enter"><b>You</b><span>The whole file. Names, accounts, amounts.</span></div>
          <div class="conn" style="--d:${d(0.5)}"><em>everything</em></div>
          <div class="node core enter" style="--d:${d(0.35)}"><b>SafeContext</b><span>On the Dell GB10. Keeps, transforms, removes.</span></div>
          <div class="conn" style="--d:${d(1.2)}"><em>envelope</em></div>
          <div class="node enter" style="--d:${d(0.7)}"><b>Claude · Copilot</b><span>Only what the task needs.</span></div>
        </div>
        <p class="caption enter" style="--d:${d(1.9)}">One layer. Nothing else changes in your workflow.</p>`);
      }
      if (n === 6) {
        return two("Names change. Numbers change.", "The private view never leaves.");
      }
      if (n === 7) {
        const rows = REDACTED.map(([k, from, to], i) =>
          `<div class="row enter-line" style="--d:${d(0.2 + i * 0.28)}">
            <span class="k">${k}</span>
            <span class="strike" style="--d:${d(0.5 + i * 0.28)}">${from}</span>
            <span class="to" style="--d:${d(0.5 + i * 0.28)}">${to}</span>
          </div>`).join("");
        return el(`<div class="doc enter">
          <p class="caps">Client file · before and after</p>
          ${rows}
        </div>`);
      }
      if (n === 8) {
        return el(`<div class="doc enter" style="max-width:64vmin">
          <p class="caps">What leaves the box</p>
          <div class="row"><span class="k">Client</span><span class="to" style="--d:0s">CLIENT_01</span><span></span></div>
          <div class="row"><span class="k">Balance</span><span class="to" style="--d:${d(0.2)}">$500k-$1M</span><span></span></div>
          <div class="row"><span class="k">Trend</span><span class="to" style="--d:${d(0.4)}">down 38% over 6 months</span><span></span></div>
          <div class="row"><span class="k">Tickets</span><span class="to" style="--d:${d(0.6)}">4 severity 1</span><span></span></div>
        </div>
        <p class="caption enter" style="--d:${d(1)}">Enough to write the summary. Not enough to identify anyone.</p>`);
      }
      if (n === 9) {
        const sheets = Array.from({ length: 20 }, (_, i) =>
          `<div class="sheet" style="--d:${d(0.1 + i * 0.045)}"><i></i><i></i><i></i><i></i><i></i></div>`).join("");
        return el(`<div class="sheets">${sheets}</div>
          <div class="h2 enter-line" style="--d:${d(1.1)}">Bob has 20 spreadsheets.</div>
          <p class="caption enter" style="--d:${d(1.6)}">Bank analyst. The meeting is at 9.</p>`);
      }
      if (n === 10) {
        return two("He wants Claude.", "Policy says no.");
      }
      if (n === 11) {
        return two("The files stay on the GB10.", "The summary still gets written.");
      }
      if (n === 12) {
        return el(`<div class="list">
          <div class="enter-line">MongoDB holds the record.</div>
          <div class="enter-line" style="--d:${d(0.55)}">OpenClaw + Qwen propose KEEP, TRANSFORM, REMOVE.</div>
          <div class="enter-line" style="--d:${d(1.1)}">minimize() executes. Policy wins.</div>
        </div>`);
      }
      if (n === 13) {
        const step = (t, body) => `<g class="enter" style="--d:${d(t)}">${body}</g>`;
        const box = (x, w, cls, title, sub) =>
          `<rect x="${x}" y="160" width="${w}" height="88" rx="10" class="${cls}" />
           <text class="t" x="${x + w / 2}" y="${sub ? 198 : 210}" text-anchor="middle">${title}</text>` +
          (sub ? `<text class="s" x="${x + w / 2}" y="216" text-anchor="middle">${sub}</text>` : "");

        return el(`<svg class="sysmap" viewBox="0 0 1170 500" role="img"
             aria-label="A task enters OpenClaw and local Qwen, which read MongoDB and propose a spec; minimize() executes it and emits an envelope. Only the envelope crosses the GB10 trust boundary to Claude.">
          <defs>
            <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path class="mk-g" d="M0 0 L10 5 L0 10 Z" />
            </marker>
            <marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path class="mk-i" d="M0 0 L10 5 L0 10 Z" />
            </marker>
          </defs>

          ${step(0.1, `<rect x="30" y="48" width="850" height="404" rx="18" class="fence" />
            <text class="z" x="54" y="82">DELL GB10 · NOTHING LEAVES</text>`)}

          ${step(0.35, box(62, 100, "box", "Task"))}
          ${step(0.5, `<path class="edge" d="M162 204 H206" marker-end="url(#ag)" />`)}
          ${step(0.6, box(206, 204, "box", "OpenClaw + Qwen", "proposes the spec"))}

          ${step(0.85, `<ellipse cx="431" cy="310" rx="90" ry="20" class="store" />
            <path class="store" d="M341 310 V376 A90 20 0 0 0 521 376 V310" />
            <text class="t" x="431" y="338" text-anchor="middle">MongoDB</text>
            <text class="s" x="431" y="356" text-anchor="middle">records · roles · policy</text>`)}

          ${step(1.0, `<path class="edge" d="M308 248 V343 H341" marker-start="url(#ag)" marker-end="url(#ag)" />
            <text class="e" x="300" y="290" text-anchor="end">whoami · bundle · policy</text>`)}

          ${step(1.2, `<path class="edge" d="M410 204 H452" marker-end="url(#ag)" />`)}
          ${step(1.3, box(452, 206, "box", "minimize()", "KEEP · TRANSFORM · REMOVE"))}
          ${step(1.45, `<path class="edge" d="M521 343 H555 V248" marker-end="url(#ag)" />
            <text class="e" x="563" y="290">policy wins</text>`)}

          ${step(1.65, `<path class="edge" d="M658 204 H700" marker-end="url(#ag)" />`)}
          ${step(1.75, box(700, 148, "box-key", "envelope", "{ task, context }"))}

          ${step(2.0, `<path class="edge-key" d="M848 204 H940" marker-end="url(#ai)" />
            <text class="e" x="894" y="182" text-anchor="middle">envelope only</text>`)}

          ${step(2.2, box(940, 196, "box-out", "Claude · Copilot", "never the file"))}
        </svg>`, "wide");
      }
      return el(`<div class="h enter">SafeContext</div>
        <p class="sub enter" style="--d:${d(0.45)}">Ask for more. Send less. More safety.</p>`);
    }

    function go(step) {
      n = Math.max(1, Math.min(LAST, n + step));
      render();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    });
    document.getElementById("stage").addEventListener("click", () => go(1));

    function wake() {
      document.getElementById("deck").classList.remove("cursor-hidden");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.getElementById("deck").classList.add("cursor-hidden"), 2000);
    }
    window.addEventListener("mousemove", wake);
    wake();

    const hash = Number(location.hash.replace("#", ""));
    n = hash >= 1 && hash <= LAST ? hash : 1;
    render();
  </script>
</body>
</html>
