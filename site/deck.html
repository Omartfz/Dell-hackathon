<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deck · SafeContext</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    html, body { height: 100%; overflow: hidden; }
    .deck { height: 100%; position: relative; }
    .layer { position: absolute; inset: 0; pointer-events: none; }
    .stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 8vh 6vw 14vh; }
    .scene { width: min(1100px, 100%); text-align: center; }
    .label {
      position: absolute; bottom: 7vh; left: 6vw;
      font-size: 2.6vmin; font-weight: 500; letter-spacing: -0.02em;
      opacity: 0; animation: fade 0.6s var(--ease) 0.2s forwards;
    }
    .pos {
      position: absolute; bottom: 7vh; right: 6vw;
      font-size: 1.6vmin; color: var(--g500); font-variant-numeric: tabular-nums;
    }
    .h {
      font-size: 7.2vmin; font-weight: 600; letter-spacing: -0.022em; line-height: 1.08;
    }
    .h2 {
      font-size: 6.6vmin; font-weight: 600; letter-spacing: -0.02em; line-height: 1.12;
    }
    .sub {
      margin-top: 2.4vmin;
      font-size: 2.8vmin;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--g600);
    }
    .enter {
      opacity: 0; transform: translateY(10px);
      animation: rise 0.9s var(--ease) forwards;
    }
    .enter-line {
      opacity: 0; transform: translateY(0.35em);
      animation: rise 0.7s var(--ease) forwards;
    }
    .glass {
      display: inline-block;
      border-radius: var(--radius-card);
      border: 1px solid rgba(255,255,255,0.5);
      padding: 6vmin 8vmin;
      background: rgba(255,255,255,0.42);
      backdrop-filter: blur(26px) saturate(120%);
      -webkit-backdrop-filter: blur(26px) saturate(120%);
      box-shadow: var(--shadow-raised);
    }
    .fade-scene { animation: sceneIn 0.35s ease-out; }
    .names {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.6vmin 3.2vmin;
      margin-top: 4.4vmin;
    }
    .names span {
      font-size: 4.4vmin;
      font-weight: 600;
      letter-spacing: -0.03em;
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.9s var(--ease) forwards;
    }
    .list {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1vmin;
    }
    .list .enter-line {
      font-size: 4.4vmin;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .arch {
      font-size: 2.2vmin; line-height: 1.65; text-align: left;
      font-variant-numeric: tabular-nums;
      display: inline-block;
    }
    @keyframes rise {
      to { opacity: 1; transform: none; }
    }
    @keyframes fade { to { opacity: 1; } }
    @keyframes sceneIn { from { opacity: 0; } to { opacity: 1; } }
    @media (max-width: 700px) {
      .names span { font-size: 5.4vmin; }
    }
  </style>
</head>
<body>
  <div class="deck" id="deck">
    <div class="layer deck-grid"></div>
    <div class="layer deck-halo" style="width:70%;height:70%;left:-10%;top:-20%"></div>
    <div class="layer deck-halo deck-halo-b" style="width:60%;height:60%;right:-10%;bottom:-20%;left:auto"></div>
    <div class="layer deck-grain"></div>
    <div class="stage" id="stage"></div>
    <div class="label" id="label"></div>
    <div class="pos tnum" id="pos"></div>
  </div>
  <script>
    const LAST = 12;
    const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let n = 1;
    let idleTimer;

    const LABELS = {
      1: "Ask for more. Send less. More safety.",
      2: "Everyone wants the new tools.",
      3: "Institutions run on privacy.",
      4: "So they never start.",
      5: "A filter between you and the model.",
      6: "Names change. Numbers change.",
      7: "Bob has 20 spreadsheets.",
      8: "He wants Claude.",
      9: "The files stay on the GB10.",
      10: "Mongo holds the record.",
      11: "The system",
      12: "SafeContext"
    };

    const TOOLS = ["Claude Code", "Cowork", "Codex", "Copilot", "ChatGPT", "Gemini"];
    const CONSTRAINTS = [
      "Client PII",
      "Patient records",
      "Account numbers",
      "Exact balances",
      "Internal memos"
    ];

    function el(html) {
      const d = document.createElement("div");
      d.className = "scene fade-scene";
      d.innerHTML = html;
      return d;
    }

    function late() {
      return reduced ? "0s" : "2.4s";
    }

    function render() {
      const stage = document.getElementById("stage");
      document.getElementById("label").textContent = LABELS[n];
      document.getElementById("pos").textContent = n + " / " + LAST;
      history.replaceState(null, "", "#" + n);
      stage.innerHTML = "";
      stage.appendChild(sceneFor(n));
    }

    function sceneFor(n) {
      if (n === 1) {
        return el(`<div class="glass enter">
          <div class="caps" style="margin-bottom:2.2vmin;letter-spacing:0.22em">SafeContext</div>
          <div class="h">Ask for more.<br />Send less.<br />More safety.</div>
        </div>`);
      }
      if (n === 2) {
        const chips = TOOLS.map((name, i) => {
          const delay = reduced ? "0s" : (0.18 + i * 0.12) + "s";
          return `<span style="animation-delay:${delay}">${name}</span>`;
        }).join("");
        return el(`<div class="h2 enter-line">Everyone wants the new tools.</div>
          <div class="names">${chips}</div>`);
      }
      if (n === 3) {
        const rows = CONSTRAINTS.map((line, i) => {
          const delay = reduced ? "0s" : (0.15 + i * 0.22) + "s";
          return `<div class="enter-line" style="animation-delay:${delay}">${line}</div>`;
        }).join("");
        return el(`<div class="list">${rows}</div>`);
      }
      if (n === 4) {
        const s = el(`<div class="h2 enter-line">So they never start.</div>
          <div class="h2 enter-line" id="l4" style="margin-top:0.4em">The tool is blocked on day one.</div>`);
        s.querySelector("#l4").style.animationDelay = late();
        return s;
      }
      if (n === 5) {
        return el(`<div class="h enter">A filter between you and the model.</div>`);
      }
      if (n === 6) {
        const s = el(`<div class="h2 enter-line">Names change. Numbers change.</div>
          <div class="h2 enter-line" id="l6" style="margin-top:0.4em">The private view never leaves.</div>`);
        s.querySelector("#l6").style.animationDelay = late();
        return s;
      }
      if (n === 7) {
        const s = el(`<div class="h2 enter-line">Bob has 20 spreadsheets.</div>
          <div class="h2 enter-line" id="l7" style="margin-top:0.4em">The meeting is at 9.</div>`);
        s.querySelector("#l7").style.animationDelay = late();
        return s;
      }
      if (n === 8) {
        const s = el(`<div class="h2 enter-line">He wants Claude.</div>
          <div class="h2 enter-line" id="l8" style="margin-top:0.4em">Policy says no.</div>`);
        s.querySelector("#l8").style.animationDelay = late();
        return s;
      }
      if (n === 9) {
        const s = el(`<div class="h2 enter-line">The files stay on the GB10.</div>
          <div class="h2 enter-line" id="l9" style="margin-top:0.4em">The summary still gets written.</div>`);
        s.querySelector("#l9").style.animationDelay = late();
        return s;
      }
      if (n === 10) {
        return el(`<div class="list">
          <div class="enter-line">MongoDB holds the record.</div>
          <div class="enter-line" style="animation-delay:${reduced ? "0s" : "0.55s"}">OpenClaw + Qwen propose KEEP, TRANSFORM, REMOVE.</div>
          <div class="enter-line" style="animation-delay:${reduced ? "0s" : "1.1s"}">minimize() executes. Policy wins.</div>
        </div>`);
      }
      if (n === 11) {
        return el(`<pre class="arch enter">task
  → OpenClaw + local Qwen
  → MongoDB   whoami · bundle · policy
  → spec { keep, transform, drop }
  → minimize()
  → copy-ready JSON
  → you → Claude</pre>`);
      }
      return el(`<div class="h enter">SafeContext</div>
        <p class="sub enter" style="animation-delay:0.45s">Ask for more. Send less. More safety.</p>`);
    }

    function go(d) {
      n = Math.max(1, Math.min(LAST, n + d));
      render();
    }

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(1); }
      if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    });
    document.getElementById("stage").addEventListener("click", () => go(1));

    function wake() {
      document.getElementById("deck").classList.remove("cursor-hidden");
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => document.getElementById("deck").classList.add("cursor-hidden"), 2000);
    }
    window.addEventListener("mousemove", wake);
    wake();

    const h = Number(location.hash.replace("#", ""));
    n = h >= 1 && h <= LAST ? h : 1;
    render();
  </script>
</body>
</html>
